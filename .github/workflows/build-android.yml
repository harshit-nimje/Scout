name: Build Scout TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "twa-manifest.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-twa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out Scout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Prepare TWA project and signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p twa
          cp twa-manifest.json twa/twa-manifest.json
          cd twa

          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required with ANDROID_KEYSTORE_BASE64"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::No persistent Android signing keystore configured. This run will create a temporary signing key; the APK is for initial testing only and future builds will not update-install over it."
            KS_PASS="ScoutTemp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v               -keystore android.keystore               -storepass "$KS_PASS"               -keypass "$KEY_PASS"               -alias scout               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Scout, OU=Android, O=Scout, L=Mumbai, ST=Maharashtra, C=IN"
          fi

          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build TWA APK
        working-directory: twa
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Verify TWA APK
        run: |
          set -euo pipefail
          test -s twa/app-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging twa/app-release-signed.apk | grep -F "package: name='app.cine'"

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: scout-twa-apk
          path: twa/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
